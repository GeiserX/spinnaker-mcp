name: govulncheck

# Fails when the server calls into code with a known Go vulnerability, in a
# dependency or in the standard library of the go.mod toolchain.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          # The action defaults go-version-input to "stable", which overrides the file.
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...
