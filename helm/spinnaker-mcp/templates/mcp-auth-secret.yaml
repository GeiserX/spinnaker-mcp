{{- if and (not .Values.mcpAuth.existingSecret) .Values.mcpAuth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spinnaker-mcp.mcpAuthSecretName" . }}
  labels:
    {{- include "spinnaker-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ .Values.mcpAuth.token | quote }}
{{- end }}
