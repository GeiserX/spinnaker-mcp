gate:
  url: "http://spin-gate:8084"
  auth:
    # Auth type: token, basic, or none (x509 certs use gate.tls.certSecret below)
    type: none
    token: ""
    user: ""
    pass: ""
    # Name of existing Secret containing auth credentials
    # Must have keys matching auth type (e.g., GATE_TOKEN for token auth)
    existingSecret: ""
  tls:
    insecure: false
    # Name of existing Secret containing client cert + key (keys: tls.crt, tls.key)
    certSecret: ""

transport: http
port: 8085
bindAddr: "0.0.0.0"
# readonly registers only the tools that read Spinnaker. Set "all" (or a list of
# groups) only if the MCP clients must trigger, cancel, edit or judge pipelines.
toolsets: "readonly"

# Every /mcp request must carry "Authorization: Bearer <token>": the pod holds the Gate
# credential, so anything that reaches the Service would otherwise act with it. The
# chart refuses to render without one of these.
mcpAuth:
  # Name of an existing Secret holding the token.
  existingSecret: ""
  existingSecretKey: MCP_AUTH_TOKEN
  # Or the token itself (for example: openssl rand -hex 32); the chart stores it in a Secret.
  token: ""

image:
  repository: drumsergio/spinnaker-mcp
  # Defaults to chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: spinnaker-mcp.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
